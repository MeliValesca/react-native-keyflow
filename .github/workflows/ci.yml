name: Library checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# PR replacements cover the full branch diff. Each non-PR run must survive
# later pushes: a shared group can replace pending runs even with cancellation off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    uses: ./.github/workflows/change-scope.yml

  check:
    needs: scope
    if: ${{ !cancelled() && (needs.scope.result != 'success' || needs.scope.outputs.library != 'false') }}
    name: Format, types, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint
      - run: yarn check
      - name: Test CI startup and result reporting
        run: |
          python3 -m unittest discover -s scripts/android-tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
