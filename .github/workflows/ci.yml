name: Library checks

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: library-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Format, types, tests, and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-js
      - name: Validate conventional PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | yarn commitlint
      - run: yarn check
      - name: Test CI startup and result reporting
        run: |
          python3 -m unittest discover -s scripts/android-tests -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
