pre-commit:
  commands:
    swift-format:
      glob: 'ios/*.swift'
      run: if command -v xcrun >/dev/null 2>&1; then xcrun swift-format lint --strict {staged_files}; fi
    lint:
      run: corepack yarn lint
    types:
      run: corepack yarn typecheck
commit-msg:
  commands:
    conventional-message:
      run: corepack yarn commitlint --edit "{1}"
